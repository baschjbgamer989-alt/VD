<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Copy Web</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), 
                        url('https://alphacoders.com') no-repeat center center/cover;
            overflow: hidden;
        }

        /* 🌈 เอฟเฟกต์ไฟวิ่ง RGB รอบกล่อง */
        @keyframes rgb-glow {
            0% { border-color: #ff0000; box-shadow: 0 0 25px #ff0000; }
            20% { border-color: #00ff00; box-shadow: 0 0 25px #00ff00; }
            40% { border-color: #0000ff; box-shadow: 0 0 25px #0000ff; }
            60% { border-color: #ffff00; box-shadow: 0 0 25px #ffff00; }
            80% { border-color: #ff00ff; box-shadow: 0 0 25px #ff00ff; }
            100% { border-color: #ff0000; box-shadow: 0 0 25px #ff0000; }
        }

        .container {
            background: rgba(15, 15, 25, 0.85);
            backdrop-filter: blur(12px);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            border: 3px solid #ff0000;
            animation: rgb-glow 4s linear infinite;
        }

        .anime-profile {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 20px;
            border: 3px solid #fff;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
        }

        h1 {
            color: #fff;
            font-size: 32px;
            margin-bottom: 25px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        /* 🔘 ปุ่มกดคัดลอกพร้อมไฟเรืองแสง */
        .btn-copy {
            background: #ff4a5a;
            color: #fff;
            border: 2px solid #fff;
            padding: 15px 40px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 20px;
            cursor: pointer;
            transition: 0.2s ease;
            box-shadow: 0 0 15px #ff4a5a;
            width: 100%;
        }

        .btn-copy:hover {
            background: #ff6b7b;
            transform: scale(1.03);
            box-shadow: 0 0 25px #ff6b7b;
        }

        .btn-copy:active {
            transform: scale(0.98);
        }

        /* 💬 ข้อความแจ้งเตือนเมื่อคัดลอกสำเร็จ */
        .alert-text {
            color: #00ff77;
            margin-top: 15px;
            font-size: 14px;
            font-weight: bold;
            display: none;
            text-shadow: 0 0 5px #00ff77;
        }
    </style>
</head>
<body>

    <div class="container">
        <img class="anime-profile" src="https://wallpapers.com" alt="Anime Profile">
        
        <h1>สวัสดีครับ! 👋</h1>
        
        <!-- ปุ่มกดเพื่อคัดลอกคำว่า 100 -->
        <button class="btn-copy" onclick="copyText()">📋 คัดลอกเลข 100</button>
        
        <div id="alert" class="alert-text">คัดลอกคำว่า "100" สำเร็จแล้ว!</div>
    </div>

    <script>
        function copyText() {
            // ระบบสั่งคัดลอกคำว่า 100 เข้าคลิปบอร์ด
            navigator.clipboard.writeText("100").then(() => {
                const alertBox = document.getElementById("alert");
                alertBox.style.display = "block"; // แสดงข้อความสีเขียว
                
                // ซ่อนข้อความแจ้งเตือนหลังจากผ่านไป 2 วินาที
                setTimeout(() => {
                    alertBox.style.display = "none";
                }, 2000);
            }).catch(err => {
                console.error('ไม่สามารถคัดลอกได้:', err);
            });
        }
    </script>

</body>
</html>
